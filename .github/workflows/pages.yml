name: Publish ParkingFlow on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Scheduled tasks can run late. These are snapshots, not second-by-second live readings.
    - cron: '2-59/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect public parking data
        run: python3 scripts/collect.py
      - name: Assemble static site
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/parking.json site/data/parking.json
          touch site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
